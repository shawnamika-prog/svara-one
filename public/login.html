<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to your SvaraONE account."><title>Sign in — SvaraONE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="/" aria-label="SvaraONE home"><img src="assets/svara-mark.svg" alt="SvaraONE"></a><div class="eyebrow">ACCOUNT</div><h1>Welcome back.</h1><p>Sign in to continue creating with SvaraONE.</p><form id="authForm" class="auth-form" data-mode="login"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div id="authError" class="auth-error" role="alert" aria-live="polite"></div><button class="auth-submit" type="submit">Sign in</button></form><div class="auth-footer">Don't have an account? <a href="/signup.html">Get started</a></div><a class="back" href="/">← Back to SvaraONE</a></section></main><script src="js/auth.js"></script></body></html>
