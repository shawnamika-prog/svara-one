<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create your SvaraONE account."><title>Create account — SvaraONE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="/" aria-label="SvaraONE home"><img src="assets/svara-mark.svg" alt="SvaraONE"></a><div class="eyebrow">ACCOUNT</div><h1>Create your account.</h1><p>Start with 5,000 free SvaraONE Credits and try the full workflow.</p><form id="authForm" class="auth-form" data-mode="register"><div class="field"><label for="display_name">Name <span>(optional)</span></label><input id="display_name" name="display_name" type="text" autocomplete="name" maxlength="80"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required><small class="auth-note">Use at least 10 characters.</small></div><div id="authError" class="auth-error" role="alert" aria-live="polite"></div><button class="auth-submit" type="submit">Create account</button></form><div class="auth-footer">Already have an account? <a href="/login.html">Sign in</a></div><a class="back" href="/">← Back to SvaraONE</a></section></main><script src="js/auth.js"></script></body></html>
